[package]
name = "python"
version = "0.0.0"
edition = "2024"


[workspace]

[dependencies]
slate-support = { path = "slate-support" }
aligned = { path = "aligned" }
bitint = { path = "bitint" }
num-complex = { path = "num-complex", default-features = false }
bitfields = { path = "bitfields" }

[build-dependencies]
cc = "1"

[lints.cargo]
unused_dependencies = "allow"

[profile.dev]
overflow-checks = false
debug-assertions = false
codegen-units = 256
